<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Galana logo design -->
  <defs>
    <linearGradient id="galanaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26A69A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Wave design -->
  <path d="M20 50 Q 35 30, 50 50 Q 65 70, 80 50 Q 65 30, 50 50 Q 35 70, 20 50"
