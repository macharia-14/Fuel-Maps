<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Kenol logo design -->
  <defs>
    <linearGradient id="kenolGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7209B7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C1D95;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main shield shape -->
  <path d="M50 15 L 75 25 L 75 60 Q 75 75, 50 80 Q 25 75, 25 60 L 25 25 Z"
        fill="url(#kenolGradient)" stroke="#333" stroke-width="2"/>

  <!-- Fuel pump symbol -->
  <rect x="40" y="35" width="20" height="25" fill="#FFF" rx="2"/>
  <circle cx="50" cy="45" r="6" fill="#333"/>
  <rect x="46" y="50" width="8" height="8" fill="#333"/>

  <!-- Handle -->
  <rect x="35" y="30" width="30" height="4" fill="#FFF" rx="2"/>
</svg>
