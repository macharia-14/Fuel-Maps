<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- National Oil logo design -->
  <defs>
    <linearGradient id="nationalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#073B4C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M50 15 L 75 25 L 75 70 L 50 80 L 25 70 L 25 25 Z"
        fill="url(#nationalGradient)" stroke="#333" stroke-width="2"/>

  <!-- Oil barrel -->
  <rect x="40" y="30" width="20" height="25" fill="#FFF" rx="2"/>
  <rect x="35" y="35" width="30" height="4" fill="#FFF"/>
  <rect x="35" y="45" width="30" height="4" fill="#FFF"/>
  <circle cx="50" cy="38" r="2" fill="#333"/>
  <circle cx="50" cy="48" r="2" fill="#333"/>
</svg>
