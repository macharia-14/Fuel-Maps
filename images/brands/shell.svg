<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shell logo inspired design -->
  <defs>
    <linearGradient id="shellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD60A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer shell shape -->
  <path d="M50 10 C 70 10, 85 25, 85 45 C 85 65, 70 80, 50 80 C 30 80, 15 65, 15 45 C 15 25, 30 10, 50 10 Z"
        fill="url(#shellGradient)" stroke="#333" stroke-width="2"/>

  <!-- Inner shell pattern -->
  <path d="M35 35 Q 50 25 65 35 Q 75 45 65 55 Q 50 65 35 55 Q 25 45 35 35 Z"
        fill="#333" opacity="0.8"/>

  <!-- Center dot -->
  <circle cx="50" cy="45" r="8" fill="#333"/>
</svg>
