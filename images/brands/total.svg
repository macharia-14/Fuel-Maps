<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Total logo inspired design -->
  <defs>
    <linearGradient id="totalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main oval shape -->
  <ellipse cx="50" cy="50" rx="40" ry="25" fill="url(#totalGradient)" stroke="#333" stroke-width="2"/>

  <!-- Inner highlight -->
  <ellipse cx="50" cy="45" rx="35" ry="20" fill="none" stroke="#FFF" stroke-width="1" opacity="0.3"/>

  <!-- Fuel drop symbol -->
  <path d="M50 25 L 45 35 L 50 40 L 55 35 Z" fill="#FFF"/>
  <rect x="48" y="40" width="4" height="15" fill="#FFF"/>
</svg>
